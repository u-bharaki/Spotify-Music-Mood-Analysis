version: '3.8'

services:
  kafka:
    image: apache/kafka:latest
    container_name: vibestream-kafka
    ports:
      - "9092:9092"
    environment:
      # 1. KRaft (No Zookeeper) Mode
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_KRAFT_CLUSTER_ID=vibestream_kraft_cluster_123

      # 2. Port and Communication
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

      # 3. Topic Automation
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
  kafka-init:
    image: apache/kafka:latest
    container_name: vibestream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      sh -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list | grep -q vibestream_logs ||
      /opt/kafka/bin/kafka-topics.sh --create --topic vibestream_logs --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092
      "

  postgres:
    image: postgres:15-alpine
    container_name: vibestream-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vibe_admin
      - POSTGRES_PASSWORD=vibe_password
      - POSTGRES_DB=vibestream_db
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../Postgre/raporUpdated.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_admin -d vibestream_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: vibestream-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data

  seeder:
    image: python:3.10-slim
    container_name: vibestream-seeder
    depends_on:
      - redis
    volumes:
      - "../:/app"
    working_dir: "/app/Redis Feed"
    command: sh -c "pip install pandas redis && python Seeder.py"

  simulator:
    image: python:3.10-slim
    container_name: vibestream-simulator
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
      seeder:
        condition: service_completed_successfully
    volumes:
      - ../:/app
    working_dir: "/app/Log Streamer"
    command: sh -c "pip install pandas kafka-python redis && tail -f /dev/null"

  # YENİ: Spark Streaming servisi eksikti. VibeStreamApp.scala'yı derleyip çalıştırır.
  # "Spark Streaming" klasöründe `sbt assembly` ile fat-jar üretildiğini varsayar
  # (build.sbt'ye eklenen sbt-assembly plugin ile).
  spark:
    image: apache/spark:3.5.0
    container_name: vibestream-spark
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - "../Spark Streaming:/app"
    working_dir: /app
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --conf "spark.jars.ivy=/tmp/.ivy2"
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.6.0,redis.clients:jedis:4.4.3,com.fasterxml.jackson.module:jackson-module-scala_2.12:2.15.2
      --class VibeStreamApp
      /app/target/scala-2.12/VibeStream-assembly-1.0.jar

  # YENİ: Dashboard - Apache Superset
  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: vibestream-superset
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=vibestream_super_secret_key_change_me
    volumes:
      - superset_home:/app/superset_home
    command: >
      sh -c "
      pip install psycopg2-binary &&
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname Admin --email admin@vibestream.com --password admin &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads --reload
      "

  # YENİ: Superset açıldıktan sonra Postgres bağlantısını ve dataset'leri
  # otomatik olarak API üzerinden oluşturan tek-seferlik provisioning container'ı.
  superset-init:
    image: python:3.10-slim
    container_name: vibestream-superset-init
    depends_on:
      - superset
    volumes:
      - "../Dashboards/superset:/app"
    working_dir: /app
    command: sh -c "pip install requests && python provision_superset.py"

volumes:
  postgres_data:
  redis_data:
  superset_home:
